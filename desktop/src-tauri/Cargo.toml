[package]
name = "legal-fact-review-desktop"
version = "0.6.0-rc1"
description = "Desktop shell for LegalFactReview"
authors = ["LegalFactReview"]
edition = "2021"

[lib]
name = "legal_fact_review_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
